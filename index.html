<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>Sachouhou</title>
<style>
        body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #9c6a28;
    }
    .container {
        background-color: #ce8b34;
        padding: 2rem 2.5rem;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
        width: 100%;
        max-width: 430px;
        box-sizing: border-box;
    }
    h1 { color: #FFF; font-size: 2.2rem; margin-bottom: 0.2rem; }
    p { color: #FFF; font-size: 1rem; margin-bottom: 1rem; }
    h2 { color: #FFF; font-size: 1.8rem; margin-bottom: 0.4rem; }
    .subtitle { color: #DDD; font-size: 1.1rem; margin-bottom: 1.2rem; }
    label { display: block; text-align: left; margin-bottom: 3px; font-size: 0.85rem; color: #DDD; }
    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border: 2px solid #AAA;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 0.95rem;
    }
    .pass-wrapper { display: flex; align-items: center; position: relative; width: 100%; }
    .pass-wrapper input { margin-bottom: 12px; }
    #toggleBtn {
        background: none;
        border: none;
        color: #555;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        position: absolute;
        right: 10px;
        top: 10px;
    }
        button {
        width: 100%;
        padding: 10px;
        background-color: #ffae42;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s;
    }
        button:hover { transform: scale(1.02); }
</style>
</head>
<body>
<div class="container">
    <h1>Sachouhou</h1>
    <p class="subtitle">Página de Inicio</p>
    <p>Es un nuevo juego por el que se puede acceder en web inspirado en Touhou Project</p>
        <h2>Selecciona un nivel</h2>
        <a href="files/ste.html">
          <button>Tutorial</button>
        </a><br>
        <a href="files/svce.html">
          <button>Sacha VS Coco</button>
        </a><br>
        <a href="files/svnle.html">
          <button>Sacha VS Lucas & Nieves</button>
        </a><br>
</div>
</body>
</html>
