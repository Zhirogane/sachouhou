<title>Sachouhou</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #39289c;
    }
    .container {
        background-color: #3472ce;
        padding: 2rem 2.5rem;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
        width: 100%;
        max-width: 430px;
        box-sizing: border-box;
    }
    h1 { color: #FFF; font-size: 2.2rem; margin-bottom: 0.2rem; }
    p { color: #FFF; font-size: 1rem; margin-bottom: 1rem; }
    a { color: #FFF; font-size: 1rem; margin-bottom: 1rem; text-decoration: underline;}
    h2 { color: #FFF; font-size: 1.8rem; margin-bottom: 0.4rem; }
    .subtitle { color: #DDD; font-size: 1.1rem; margin-bottom: 1.2rem; }
    
    .container a {
        display: block;
        margin-bottom: 12px;
        text-decoration: none;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #42d3ff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s;
    }
    button:hover { 
        transform: scale(1.02); 
    }
</style>
</head>

    <h1>Sachouhou</h1>
